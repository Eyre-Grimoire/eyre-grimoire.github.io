<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Eyre 工作台</title>
    <style>
        /* ———— 全局重置 & 基础 ———— */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #e3f2e3 0%, #b8d9b8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ———— 页面容器（启动页 & 主页） ———— */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.8rem 1.2rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.55s ease, visibility 0.55s ease;
            will-change: opacity, visibility;
            z-index: 1;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        /* ———— 启动页 ———— */
        #startPage .start-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 520px;
            padding: 1.2rem;
        }

        .hello-btn {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            padding: 1.2rem 3.2rem;
            border-radius: 80px;
            font-size: clamp(2.6rem, 10vw, 4.8rem);
            font-weight: 600;
            color: #1e3a2a;
            letter-spacing: 0.04em;
            box-shadow: 0 20px 40px -12px rgba(30, 60, 40, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.3s ease;
            user-select: none;
            line-height: 1.3;
            min-width: 200px;
        }

        .hello-btn:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 28px 48px -14px rgba(30, 60, 40, 0.35);
            background: rgba(255, 255, 255, 0.65);
        }

        .hello-btn:active {
            transform: scale(0.96);
            transition-duration: 0.08s;
        }

        .start-slogan {
            margin-top: 2.2rem;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #1f4a2d;
            font-weight: 400;
            letter-spacing: 0.06em;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: floatSlogan 4s ease-in-out infinite;
            line-height: 1.5;
        }

        @keyframes floatSlogan {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* ———— 工作台主页 ———— */
        #mainPage {
            align-items: flex-start;
            padding-top: 2.2rem;
            padding-bottom: 2.8rem;
        }

        .main-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
        }

        /* --- 顶部栏：返回 + 日期时间 --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.6rem 1rem;
            padding: 0.2rem 0.2rem 0.4rem 0.2rem;
        }

        .back-link {
            font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            color: #1f4a2d;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 0.5rem 1.2rem 0.5rem 0.9rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            font-weight: 500;
            transition: background 0.25s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            box-shadow: 0 2px 8px rgba(0, 30, 0, 0.06);
            white-space: nowrap;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.55);
            transform: translateX(-2px);
        }

        .back-link:active {
            transform: scale(0.94);
        }

        .datetime-group {
            text-align: right;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.6rem 1.4rem 0.7rem 1.4rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 12px rgba(0, 30, 0, 0.06);
            min-width: 140px;
        }

        .date-display {
            font-size: clamp(0.85rem, 2.2vw, 1.1rem);
            color: #1e3a2a;
            font-weight: 500;
            letter-spacing: 0.04em;
            opacity: 0.85;
            line-height: 1.4;
        }

        .time-display {
            font-size: clamp(2rem, 6.5vw, 3.2rem);
            font-weight: 600;
            color: #163623;
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            margin-top: 0.1rem;
        }

        .greeting-display {
            font-size: clamp(1rem, 2.8vw, 1.45rem);
            font-weight: 500;
            color: #1f4a2d;
            letter-spacing: 0.04em;
            opacity: 0.9;
            margin-top: 0.1rem;
        }

        /* 分割线 + 天数行 */
        .day-divider {
            border-top: 1px solid rgba(30, 60, 40, 0.12);
            margin: 0.4rem 0 0.3rem 0;
            width: 100%;
        }

        .day-count {
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            color: rgba(30, 60, 40, 0.5);
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
            margin-top: 0.1rem;
        }

        .day-icon {
            font-size: clamp(0.65rem, 1.4vw, 0.8rem);
        }

        .day-number {
            color: #2e7d32;
            font-weight: 700;
            font-size: clamp(0.75rem, 1.7vw, 0.95rem);
        }

        /* --- 四个卡片（原三个 + 奶茶记录 + 今日心情） --- */
        .cards-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1.2rem;
            margin-top: 0.2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.6rem 1rem 1.8rem 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(0, 30, 0, 0.08);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            cursor: default;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 30, 0, 0.12);
            background: rgba(255, 255, 255, 0.7);
        }

        .card-emoji {
            font-size: clamp(2.6rem, 6vw, 3.6rem);
            line-height: 1.2;
            margin-bottom: 0.3rem;
        }

        .card-title {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 600;
            color: #1b3a22;
            letter-spacing: 0.03em;
        }

        .card-desc {
            font-size: clamp(0.7rem, 1.8vw, 0.9rem);
            color: #2d5a3d;
            opacity: 0.7;
            margin-top: 0.2rem;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* --- 奶茶记录卡片 & 今日心情卡片 (可点击) --- */
        #drinkCard,
        #moodCard {
            cursor: pointer;
        }
        #drinkCard:hover,
        #moodCard:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 30, 0, 0.12);
            background: rgba(255, 255, 255, 0.7);
        }

        /* ———— 【新增】今日心情卡片上的预览徽标 ———— */
        .mood-preview-badge {
            display: inline-block;
            margin-top: 0.4rem;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            background: rgba(255, 255, 255, 0.5);
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            color: #2d5a3d;
            opacity: 0.8;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .mood-preview-badge .preview-emoji {
            margin-right: 0.2rem;
        }
        .mood-preview-badge .preview-text {
            font-weight: 400;
        }
        .mood-preview-badge.empty-preview {
            opacity: 0.4;
            font-style: italic;
        }

        /* ———— 【移除】原 mood-section 已删除，替换为卡片入口 ———— */

        /* ———— 【新增】心情详情页 ———— */
        #moodPage {
            align-items: flex-start;
            padding-top: 1.8rem;
            padding-bottom: 2.8rem;
        }
        .mood-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .mood-top-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0 0.2rem;
        }
        .mood-back {
            flex-shrink: 0;
        }
        .mood-title {
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            font-weight: 600;
            color: #1e3a2a;
            letter-spacing: 0.04em;
        }

        /* 输入卡片 */
        .mood-input-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.4rem 1.4rem 1.6rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(0, 30, 0, 0.05);
        }
        .mood-input-title {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 500;
            color: #1b3a22;
            margin-bottom: 0.8rem;
            opacity: 0.7;
        }
        .mood-input-card input[type="text"] {
            width: 100%;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            border: 1.5px solid rgba(60, 120, 80, 0.15);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: clamp(0.95rem, 2.4vw, 1.1rem);
            color: #1b3a22;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
            margin-bottom: 0.8rem;
        }
        .mood-input-card input[type="text"]::placeholder {
            color: #5a7a6a;
            opacity: 0.5;
            font-weight: 300;
        }
        .mood-input-card input[type="text"]:focus {
            border-color: #4c8b5a;
            box-shadow: 0 0 0 4px rgba(60, 140, 80, 0.1);
            background: rgba(255, 255, 255, 0.8);
        }

        /* 表情选择器 */
        .mood-emoji-selector {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.6rem;
            margin-bottom: 1rem;
        }
        .mood-emoji-label {
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            color: #2d5a3d;
            opacity: 0.7;
            font-weight: 400;
            margin-right: 0.2rem;
        }
        .mood-emoji-options {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .mood-emoji-option {
            font-size: clamp(1.8rem, 4.5vw, 2.6rem);
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s, opacity 0.2s;
            user-select: none;
            line-height: 1;
            padding: 0.1rem 0.15rem;
            border-radius: 12px;
            opacity: 0.5;
            filter: grayscale(0.6);
            transform: scale(0.9);
        }
        .mood-emoji-option:hover {
            transform: scale(1.15);
            opacity: 0.8;
            filter: grayscale(0.2);
        }
        .mood-emoji-option.active {
            opacity: 1;
            filter: grayscale(0);
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 3px rgba(60, 140, 80, 0.15);
            border-radius: 16px;
            padding: 0.1rem 0.3rem;
        }

        .mood-input-card button {
            width: 100%;
            padding: 0.7rem 0;
            border-radius: 60px;
            border: none;
            background: rgba(60, 130, 80, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #fff;
            font-size: clamp(0.95rem, 2.4vw, 1.1rem);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
            box-shadow: 0 4px 12px rgba(40, 100, 60, 0.15);
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.15);
            letter-spacing: 0.04em;
        }
        .mood-input-card button:hover {
            background: rgba(50, 140, 80, 0.9);
            transform: scale(1.01);
            box-shadow: 0 6px 18px rgba(40, 100, 60, 0.25);
        }
        .mood-input-card button:active {
            transform: scale(0.96);
            transition-duration: 0.08s;
        }

        /* 今天的心情显示 */
        .mood-today-display {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.2rem 1.4rem 1.4rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(0, 30, 0, 0.05);
            min-height: 80px;
        }
        .mood-today-label {
            font-size: clamp(0.8rem, 1.8vw, 0.95rem);
            font-weight: 500;
            color: #1b3a22;
            opacity: 0.5;
            margin-bottom: 0.4rem;
            letter-spacing: 0.04em;
        }
        .mood-today-content {
            font-size: clamp(1rem, 2.6vw, 1.3rem);
            color: #1b3a22;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            min-height: 2.6rem;
            word-break: break-word;
            line-height: 1.5;
        }
        .mood-today-content .empty-hint {
            color: #5a7a6a;
            opacity: 0.4;
            font-weight: 300;
            font-size: clamp(0.9rem, 2vw, 1.05rem);
        }
        .mood-today-content .today-emoji {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            flex-shrink: 0;
        }
        .mood-today-content .today-text {
            font-weight: 450;
        }

        /* 历史记录 */
        .mood-history-section {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.2rem 1.4rem 1rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(0, 30, 0, 0.05);
            max-height: 300px;
            overflow-y: auto;
        }
        .mood-history-section::-webkit-scrollbar {
            width: 4px;
        }
        .mood-history-section::-webkit-scrollbar-thumb {
            background: rgba(60, 120, 80, 0.25);
            border-radius: 10px;
        }
        .mood-history-section::-webkit-scrollbar-track {
            background: transparent;
        }
        .mood-history-title {
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 500;
            color: #1b3a22;
            opacity: 0.6;
            margin-bottom: 0.6rem;
            letter-spacing: 0.04em;
        }
        .mood-history-list {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }
        .mood-history-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.3rem;
            border-bottom: 1px solid rgba(60, 120, 80, 0.06);
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: #1b3a22;
        }
        .mood-history-item:last-child {
            border-bottom: none;
        }
        .mood-history-item .h-date {
            font-size: clamp(0.65rem, 1.4vw, 0.8rem);
            color: rgba(30, 60, 40, 0.4);
            flex-shrink: 0;
            min-width: 80px;
        }
        .mood-history-item .h-emoji {
            font-size: clamp(1.2rem, 2.8vw, 1.6rem);
            flex-shrink: 0;
        }
        .mood-history-item .h-text {
            flex: 1;
            font-weight: 400;
            word-break: break-word;
        }
        .mood-history-empty {
            text-align: center;
            color: rgba(30, 60, 40, 0.35);
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            padding: 1.2rem 0;
            font-weight: 300;
        }

        /* ———— 奶茶记录页面 (保持不变) ———— */
        #drinkPage {
            align-items: flex-start;
            padding-top: 1.8rem;
            padding-bottom: 2.8rem;
        }
        .drink-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .drink-top-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0 0.2rem;
        }
        .drink-back {
            flex-shrink: 0;
        }
        .drink-title {
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            font-weight: 600;
            color: #1e3a2a;
            letter-spacing: 0.04em;
        }
        .category-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .category-tab {
            flex: 1;
            min-width: 60px;
            padding: 0.5rem 0.8rem;
            border: none;
            border-radius: 30px;
            background: transparent;
            font-size: clamp(0.85rem, 2vw, 1.05rem);
            font-weight: 500;
            color: #1e3a2a;
            opacity: 0.6;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .category-tab:hover {
            opacity: 0.85;
            background: rgba(255, 255, 255, 0.2);
        }
        .category-tab.active {
            opacity: 1;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 30, 0, 0.06);
        }
        .drink-list {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.2rem 1.2rem 0.8rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            min-height: 120px;
            max-height: 320px;
            overflow-y: auto;
            box-shadow: 0 4px 16px rgba(0, 30, 0, 0.05);
        }
        .drink-list::-webkit-scrollbar {
            width: 4px;
        }
        .drink-list::-webkit-scrollbar-thumb {
            background: rgba(60, 120, 80, 0.25);
            border-radius: 10px;
        }
        .drink-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .drink-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.4rem;
            border-bottom: 1px solid rgba(60, 120, 80, 0.08);
            font-size: clamp(0.9rem, 2.2vw, 1.05rem);
            color: #1b3a22;
        }
        .drink-item:last-child {
            border-bottom: none;
        }
        .drink-item .drink-name {
            font-weight: 500;
            flex: 1;
        }
        .drink-item .drink-stars {
            color: #f5b342;
            font-size: clamp(0.8rem, 1.8vw, 1rem);
            letter-spacing: 1px;
            margin-left: 0.6rem;
            flex-shrink: 0;
        }
        .drink-item .drink-time {
            font-size: clamp(0.6rem, 1.4vw, 0.75rem);
            color: rgba(30, 60, 40, 0.4);
            margin-left: 0.8rem;
            flex-shrink: 0;
        }
        .drink-empty {
            text-align: center;
            color: rgba(30, 60, 40, 0.35);
            font-size: clamp(0.9rem, 2vw, 1.05rem);
            padding: 1.8rem 0;
            font-weight: 300;
        }
        .drink-form {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.2rem 1.4rem 1.4rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.5);

        .drink-form-row select {
            flex: 1 1 120px;
            padding: 0.6rem 1rem;
            border-radius: 60px;
            border: 1.5px solid rgba(60, 120, 80, 0.15);

            backdrop-filter: blur(4px);

            font-size: clamp(0.85rem, 2vw, 1rem);

        /* ———— 响应式微调 ———— */
        @media (max-width: 500px) {
            .page {
                padding: 1rem 0.8rem;

            <!-- 输入卡片 -->

                <!-- 表情选择器 -->

            <div class="mood-history-section">
                <div class="mood-history-title">📋 历史记录</div>
                <div class="mood-history-list" id="moodHistoryList">
                    <div class="mood-history-empty">暂无历史记录</div>
                </div>

    </div>

    <script>
        (function() {
            "use strict";

            // ———— DOM 引用 ————
            const startPage = document.getElementById('startPage');
            const mainPage = document.getElementById('mainPage');
            const drinkPage = document.getElementById('drinkPage');
            const moodPage = document.getElementById('moodPage'); // 【新增】
            const helloBtn = document.getElementById('helloBtn');
            const backBtn = document.getElementById('backBtn');
            const drinkBackBtn = document.getElementById('drinkBackBtn');
            const drinkCard = document.getElementById('drinkCard');
            const moodCard = document.getElementById('moodCard'); // 【新增】
            const moodBackBtn = document.getElementById('moodBackBtn'); // 【新增】

            const dateDisplay = document.getElementById('dateDisplay');
            const timeDisplay = document.getElementById('timeDisplay');
            const greetingDisplay = document.getElementById('greetingDisplay');
            const dayNumberEl = document.getElementById('dayNumber');

            // 【新增】心情相关 DOM
            const moodTextInput = document.getElementById('moodTextInput');
            const moodSaveBtn = document.getElementById('moodSaveBtn');
            const moodTodayContent = document.getElementById('moodTodayContent');
            const moodHistoryList = document.getElementById('moodHistoryList');
            const moodEmojiOptions = document.getElementById('moodEmojiOptions');
            const moodPreviewBadge = document.getElementById('moodPreviewBadge');

            // ———— 页面切换 ————
            function showPage(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                const target = document.getElementById(pageId);
                if (target) target.classList.add('active');
                // 如果切换到奶茶记录页，刷新列表
                if (pageId === 'drinkPage') {
                    renderDrinkList(currentCategory);
                }
                // 【新增】如果切换到心情页，刷新数据
                if (pageId === 'moodPage') {
                    loadAndRenderMood();
                    // 聚焦输入框
                    setTimeout(() => moodTextInput.focus(), 300);
                }
                // 如果切换到主页，更新预览徽标
                if (pageId === 'mainPage') {
                    updateMoodPreviewBadge();
                }
            }

            helloBtn.addEventListener('click', function(e) {
                e.preventDefault();
                showPage('mainPage');
                updateClockAndGreeting();
                setTimeout(() => {
                    // 聚焦到第一个可输入的地方（如果有）
                }, 300);
            });

            backBtn.addEventListener('click', function(e) {
                e.preventDefault();
                showPage('startPage');
            });

            drinkBackBtn.addEventListener('click', function(e) {
                e.preventDefault();
                showPage('mainPage');
            });

            drinkCard.addEventListener('click', function() {
                showPage('drinkPage');
            });

            // 【新增】心情卡片点击
            moodCard.addEventListener('click', function() {
                showPage('moodPage');
            });

            moodBackBtn.addEventListener('click', function(e) {
                e.preventDefault();
                showPage('mainPage');
            });

            // ———— 工具函数 ————
            function pad(n) {
                return String(n).padStart(2, '0');
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // 获取今日日期字符串 YYYY-MM-DD
            function getTodayStr() {
                const now = new Date();
                return now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0');
            }

            // 格式化日期显示
            function formatDateDisplay(dateStr) {
                const parts = dateStr.split('-');
                if (parts.length !== 3) return dateStr;
                return parts[0] + '年' + parseInt(parts[1], 10) + '月' + parseInt(parts[2], 10) + '日';
            }

            // ———— 计算使用天数 (从2026年8月3日算第1天) ————
            function updateDayCount() {
                const today = new Date();
                const baseDate = new Date(2026, 7, 3);
                const diffMs = today - baseDate;
                const diffDays = Math.floor(diffMs / (24 * 60 * 60 * 1000)) + 1;
                const days = diffDays < 0 ? 0 : diffDays;
                if (dayNumberEl) {
                    dayNumberEl.textContent = days;
                }
            }

            // ———— 时钟 & 问候语 ————
            function updateClockAndGreeting() {
                const now = new Date();
                const h = now.getHours();
                const m = now.getMinutes();
                const s = now.getSeconds();

                timeDisplay.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);

                const year = now.getFullYear();
                const month = pad(now.getMonth() + 1);
                const day = pad(now.getDate());
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const weekday = weekdays[now.getDay()];
                dateDisplay.textContent = year + '年 ' + month + '月 ' + day + '日  ' + weekday;

                let greeting = '';
                let emoji = '';
                if (h >= 6 && h < 12) {
                    greeting = '早安';
                    emoji = '🌅';
                } else if (h >= 12 && h < 18) {
                    greeting = '下午好';
                    emoji = '☀️';
                } else {
                    greeting = '晚安';
                    emoji = '🌙';
                }
                greetingDisplay.textContent = emoji + ' ' + greeting;

                updateDayCount();
            }

            updateClockAndGreeting();
            setInterval(updateClockAndGreeting, 1000);

            // ============================================================
            // 【新增】心情数据管理
            // ============================================================

            const MOOD_STORAGE_KEY = 'eyre_mood_records_v2';

            // 默认数据
            function getDefaultMoodData() {
                return [];
            }

            // 加载所有心情记录
            function loadAllMoodRecords() {
                try {
                    const data = localStorage.getItem(MOOD_STORAGE_KEY);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed)) {
                            return parsed;
                        }
                    }
                } catch (e) { /* ignore */ }
                return getDefaultMoodData();
            }

            // 保存所有心情记录
            function saveAllMoodRecords(records) {
                localStorage.setItem(MOOD_STORAGE_KEY, JSON.stringify(records));
            }

            // 获取今天的心情记录（如果有）
            function getTodayMood(records) {
                const today = getTodayStr();
                return records.find(r => r.date === today) || null;
            }

            // 获取所有历史记录（按日期倒序）
            function getHistoryRecords(records) {
                return records.slice().sort((a, b) => b.date.localeCompare(a.date));
            }

            // 保存心情（如果今天已有则覆盖，否则新增）
            function saveMood(text, emoji) {
                const trimmed = text.trim();
                if (trimmed === '') {
                    // 如果文字为空，不保存
                    return false;
                }
                const today = getTodayStr();
                const records = loadAllMoodRecords();
                const existingIndex = records.findIndex(r => r.date === today);
                const newRecord = {
                    date: today,
                    text: trimmed,
                    emoji: emoji || '😐'
                };
                if (existingIndex >= 0) {
                    records[existingIndex] = newRecord;
                } else {
                    records.push(newRecord);
                }
                saveAllMoodRecords(records);
                return true;
            }

            // 加载并渲染心情数据
            function loadAndRenderMood() {
                const records = loadAllMoodRecords();
                const today = getTodayStr();
                const todayRecord = records.find(r => r.date === today);

                // 渲染今日心情
                if (todayRecord) {
                    moodTodayContent.innerHTML =
                        '<span class="today-emoji">' + escapeHtml(todayRecord.emoji || '😐') + '</span>' +
                        '<span class="today-text">' + escapeHtml(todayRecord.text) + '</span>';
                } else {
                    moodTodayContent.innerHTML = '<span class="empty-hint">还没有记录今天的心情 ✍️</span>';
                }

                // 渲染历史记录
                const history = getHistoryRecords(records);
                if (history.length === 0) {
                    moodHistoryList.innerHTML = '<div class="mood-history-empty">暂无历史记录</div>';
                } else {
                    let html = '';
                    history.forEach(r => {
                        const displayDate = formatDateDisplay(r.date);
                        html += `
                            <div class="mood-history-item">
                                <span class="h-date">${escapeHtml(displayDate)}</span>
                                <span class="h-emoji">${escapeHtml(r.emoji || '😐')}</span>
                                <span class="h-text">${escapeHtml(r.text)}</span>
                            </div>
                        `;
                    });
                    moodHistoryList.innerHTML = html;
                }

                // 更新主页的预览徽标
                updateMoodPreviewBadge();
            }

            // 更新主页卡片上的预览徽标
            function updateMoodPreviewBadge() {
                const records = loadAllMoodRecords();
                const today = getTodayStr();
                const todayRecord = records.find(r => r.date === today);
                if (todayRecord) {
                    const emoji = todayRecord.emoji || '🌸';
                    const text = todayRecord.text.length > 12 ?
                        todayRecord.text.slice(0, 12) + '…' :
                        todayRecord.text;
                    moodPreviewBadge.innerHTML =
                        '<span class="preview-emoji">' + escapeHtml(emoji) + '</span>' +
                        '<span class="preview-text">' + escapeHtml(text) + '</span>';
                    moodPreviewBadge.classList.remove('empty-preview');
                } else {
                    moodPreviewBadge.innerHTML =
                        '<span class="preview-emoji">🌸</span>' +
                        '<span class="preview-text">记一笔心情</span>';
                    moodPreviewBadge.classList.add('empty-preview');
                }
            }

            // ———— 表情选择器 ————
            let selectedEmoji = '😐';

            moodEmojiOptions.addEventListener('click', function(e) {
                const option = e.target.closest('.mood-emoji-option');
                if (!option) return;
                const emoji = option.dataset.emoji;
                if (!emoji) return;
                // 取消所有选中状态
                moodEmojiOptions.querySelectorAll('.mood-emoji-option').forEach(el => {
                    el.classList.remove('active');
                });
                option.classList.add('active');
                selectedEmoji = emoji;
            });

            // 默认选中 😐
            const defaultOption = moodEmojiOptions.querySelector('[data-emoji="😐"]');
            if (defaultOption) {
                defaultOption.classList.add('active');
                selectedEmoji = '😐';
            }

            // ———— 保存心情 ————
            moodSaveBtn.addEventListener('click', function() {
                const text = moodTextInput.value.trim();
                if (text === '') {
                    alert('请写下今天的心情 ✍️');
                    moodTextInput.focus();
                    return;
                }
                const success = saveMood(text, selectedEmoji);
                if (success) {
                    moodTextInput.value = '';
                    // 重置表情选择到默认
                    moodEmojiOptions.querySelectorAll('.mood-emoji-option').forEach(el => {
                        el.classList.remove('active');
                    });
                    const defaultOpt = moodEmojiOptions.querySelector('[data-emoji="😐"]');
                    if (defaultOpt) {
                        defaultOpt.classList.add('active');
                        selectedEmoji = '😐';
                    } else {
                        selectedEmoji = '😐';
                    }
                    loadAndRenderMood();
                    // 提示保存成功
                    moodTodayContent.style.transition = 'opacity 0.2s';
                    moodTodayContent.style.opacity = '0.6';
                    setTimeout(() => {
                        moodTodayContent.style.opacity = '1';
                    }, 150);
                    moodTextInput.focus();
                } else {
                    alert('保存失败，请重试');
                }
            });

            moodTextInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    moodSaveBtn.click();
                }
            });

            // ———— 迁移旧数据 (从 MOOD_KEY 迁移) ————
            function migrateOldMoodData() {
                const oldKey = 'eyre_workbench_mood';
                try {
                    const oldData = localStorage.getItem(oldKey);
                    if (oldData && oldData.trim() !== '') {
                        // 检查是否已经迁移过（新存储中有数据）
                        const newRecords = loadAllMoodRecords();
                        if (newRecords.length === 0) {
                            // 尝试迁移
                            const today = getTodayStr();
                            // 判断旧数据是否包含日期信息？没有，直接用今天
                            const newRecord = {
                                date: today,
                                text: oldData.trim(),
                                emoji: '🌸' // 默认用🌸
                            };
                            saveAllMoodRecords([newRecord]);
                            // 删除旧数据
                            localStorage.removeItem(oldKey);
                            console.log('✅ 已迁移旧心情数据');
                        }
                    }
                } catch (e) { /* ignore */ }
            }

            // ———— 奶茶记录 (localStorage) ————
            const DRINK_KEY = 'eyre_drink_records';

            function getDefaultDrinks() {
                return { records: [] };
            }

            function loadDrinkRecords() {
                try {
                    const data = localStorage.getItem(DRINK_KEY);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed && typeof parsed === 'object' && Array.isArray(parsed.records)) {
                            return parsed;
                        }
                    }
                } catch (e) {}
                return getDefaultDrinks();
            }

            function saveDrinkRecords(data) {
                localStorage.setItem(DRINK_KEY, JSON.stringify(data));
            }

            let currentCategory = '奶茶';
            let selectedRating = 0;

            const categoryTabs = document.getElementById('categoryTabs');
            const drinkList = document.getElementById('drinkList');
            const drinkInput = document.getElementById('drinkInput');
            const drinkCategorySelect = document.getElementById('drinkCategorySelect');
            const starRating = document.getElementById('starRating');
            const drinkSaveBtn = document.getElementById('drinkSaveBtn');

            // 分类切换
            categoryTabs.addEventListener('click', function(e) {
                const tab = e.target.closest('.category-tab');
                if (!tab) return;
                categoryTabs.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                renderDrinkList(currentCategory);
            });

            // 渲染记录列表
            function renderDrinkList(category) {
                const data = loadDrinkRecords();
                const filtered = data.records.filter(r => r.category === category);
                filtered.sort((a, b) => b.id - a.id);

                if (filtered.length === 0) {
                    drinkList.innerHTML = `<div class="drink-empty">🍃 还没有记录，写点什么吧</div>`;
                    return;
                }

                let html = '';
                filtered.forEach(r => {
                    const stars = '⭐'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                    const timeStr = r.date || '';
                    html += `
                        <div class="drink-item">
                            <span class="drink-name">${escapeHtml(r.name)}</span>
                            <span class="drink-stars">${stars}</span>
                            <span class="drink-time">${timeStr}</span>
                        </div>
                    `;
                });
                drinkList.innerHTML = html;
            }

            // 星级选择
            starRating.addEventListener('click', function(e) {
                const star = e.target.closest('.star');
                if (!star) return;
                const value = parseInt(star.dataset.value, 10);
                selectedRating = value;
                starRating.querySelectorAll('.star').forEach(s => {
                    const v = parseInt(s.dataset.value, 10);
                    s.classList.toggle('active', v <= value);
                });
            });

            // 保存记录
            drinkSaveBtn.addEventListener('click', function() {
                const name = drinkInput.value.trim();
                if (!name) {
                    alert('请输入饮品名称 ✍️');
                    drinkInput.focus();
                    return;
                }
                if (selectedRating === 0) {
                    alert('请选择喜好程度 ⭐');
                    return;
                }
                const category = drinkCategorySelect.value;

                const data = loadDrinkRecords();
                const now = new Date();
                const dateStr =
                    now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0');

                data.records.push({
                    id: Date.now(),
                    name: name,
                    category: category,
                    rating: selectedRating,
                    date: dateStr
                });

                saveDrinkRecords(data);
                renderDrinkList(currentCategory);

                drinkInput.value = '';
                selectedRating = 0;
                starRating.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
                drinkInput.focus();
            });

            drinkInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    drinkSaveBtn.click();
                }
            });

            // ============================================================
            // 【新增】初始化
            // ============================================================

            // 迁移旧数据
            migrateOldMoodData();

            // 加载心情数据
            loadAndRenderMood();

            // 确保启动页可见
            document.addEventListener('DOMContentLoaded', function() {
                if (mainPage.classList.contains('active')) {
                    // 如果主页激活，加载心情预览
                    updateMoodPreviewBadge();
                }
                if (!startPage.classList.contains('active') &&
                    !mainPage.classList.contains('active') &&
                    !drinkPage.classList.contains('active') &&
                    !moodPage.classList.contains('active')) {
                    startPage.classList.add('active');
                }
                // 初始化奶茶记录页的分类高亮
                const firstTab = categoryTabs.querySelector('.category-tab');
                if (firstTab) {
                    categoryTabs.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    firstTab.classList.add('active');
                    currentCategory = firstTab.dataset.category;
                }
                if (drinkPage.classList.contains('active')) {
                    renderDrinkList(currentCategory);
                }
                if (moodPage.classList.contains('active')) {
                    loadAndRenderMood();
                }
                // 更新预览徽标
                updateMoodPreviewBadge();
            });

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateClockAndGreeting();
                    // 如果心情页可见，刷新数据
                    if (moodPage.classList.contains('active')) {
                        loadAndRenderMood();
                    }
                    // 更新预览徽标
                    updateMoodPreviewBadge();
                }
            });

            console.log('✨ Eyre 工作台已加载 (含今日心情卡片) ✨');
        })();
    </script>
</body>
</html>
