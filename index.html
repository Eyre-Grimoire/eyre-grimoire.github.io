<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Eyre 工作台</title>
    <style>
        /* ———— 全局重置 & 基础 ———— */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #e3f2e3 0%, #b8d9b8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ———— 页面容器 ———— */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.8rem 1.2rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.55s ease, visibility 0.55s ease;
            will-change: opacity, visibility;
            z-index: 1;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        /* ———— 启动页 ———— */
        #startPage .start-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 520px;
            padding: 1.2rem;
        }

        .hello-btn {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            padding: 1.2rem 3.2rem;
            border-radius: 80px;
            font-size: clamp(2.6rem, 10vw, 4.8rem);
            font-weight: 600;
            color: #1e3a2a;
            letter-spacing: 0.04em;
            box-shadow: 0 20px 40px -12px rgba(30, 60, 40, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.3s ease;
            user-select: none;
            line-height: 1.3;
            min-width: 200px;
        }

        .hello-btn:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 28px 48px -14px rgba(30, 60, 40, 0.35);
            background: rgba(255, 255, 255, 0.65);
        }

        .hello-btn:active {
            transform: scale(0.96);
            transition-duration: 0.08s;
        }

        .start-slogan {
            margin-top: 2.2rem;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #1f4a2d;
            font-weight: 400;
            letter-spacing: 0.06em;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: floatSlogan 4s ease-in-out infinite;
            line-height: 1.5;
        }

        @keyframes floatSlogan {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* ———— 工作台主页 ———— */
        #mainPage {
            align-items: flex-start;
            padding-top: 2.2rem;
            padding-bottom: 2.8rem;
        }

        .main-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.6rem 1rem;
            padding: 0.2rem 0.2rem 0.4rem 0.2rem;
        }

        .back-link {
            font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            color: #1f4a2d;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 0.5rem 1.2rem 0.5rem 0.9rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            font-weight: 500;
            transition: background 0.25s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            box-shadow: 0 2px 8px rgba(0, 30, 0, 0.06);
            white-space: nowrap;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.55);
            transform: translateX(-2px);
        }

        .back-link:active {
            transform: scale(0.94);
        }

        .datetime-group {
            text-align: right;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.6rem 1.4rem 0.7rem 1.4rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 12px rgba(0, 30, 0, 0.06);
            min-width: 140px;
        }

        .date-display {
            font-size: clamp(0.85rem, 2.2vw, 1.1rem);
            color: #1e3a2a;
            font-weight: 500;
            letter-spacing: 0.04em;
            opacity: 0.85;
            line-height: 1.4;
        }

        .time-display {
            font-size: clamp(2rem, 6.5vw, 3.2rem);
            font-weight: 600;
            color: #163623;
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            margin-top: 0.1rem;
        }

        .greeting-display {
            font-size: clamp(1rem, 2.8vw, 1.45rem);
            font-weight: 500;
            color: #1f4a2d;
            letter-spacing: 0.04em;
            opacity: 0.9;
            margin-top: 0.1rem;
        }

        .day-divider {
            border-top: 1px solid rgba(30, 60, 40, 0.12);
            margin: 0.4rem 0 0.3rem 0;
            width: 100%;
        }

        .day-count {
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            color: rgba(30, 60, 40, 0.5);
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
            margin-top: 0.1rem;
        }

        .day-icon {
            font-size: clamp(0.65rem, 1.4vw, 0.8rem);
        }

        .day-number {
            color: #2e7d32;
            font-weight: 700;
            font-size: clamp(0.75rem, 1.7vw, 0.95rem);
        }

        /* ———— 卡片网格 ———— */
        .cards-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1.2rem;
            margin-top: 0.2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.6rem 1rem 1.8rem 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(0, 30, 0, 0.08);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            cursor: default;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 30, 0, 0.12);
            background: rgba(255, 255, 255, 0.7);
        }

        .card-emoji {
            font-size: clamp(2.6rem, 6vw, 3.6rem);
            line-height: 1.2;
            margin-bottom: 0.3rem;
        }

        .card-title {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 600;
            color: #1b3a22;
            letter-spacing: 0.03em;
        }

        .card-desc {
            font-size: clamp(0.7rem, 1.8vw, 0.9rem);
            color: #2d5a3d;
            opacity: 0.7;
            margin-top: 0.2rem;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        #drinkCard,
        #moodCard {
            cursor: pointer;
        }
        #drinkCard:hover,
        #moodCard:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 30, 0, 0.12);
            background: rgba(255, 255, 255, 0.7);
        }

        /* ———— 心情预览徽标 ———— */
        .mood-preview-badge {
            display: inline-block;
            margin-top: 0.4rem;
            font-size: clamp(0.7rem, 1.6vw, 0.85rem);
            background: rgba(255, 255, 255, 0.5);
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            color: #2d5a3d;
            opacity: 0.8;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .mood-preview-badge .preview-emoji {
            margin-right: 0.2rem;
        }
        .mood-preview-badge .preview-text {
            font-weight: 400;
        }
        .mood-preview-badge.empty-preview {
            opacity: 0.4;
            font-style: italic;
        }

        /* ———— 心情详情页 ———— */
        #moodPage {
            align-items: flex-start;
            padding-top: 1.8rem;
            padding-bottom: 2.8rem;
        }
        .mood-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .mood-top-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0 0.2rem;
        }
        .mood-back {
            flex-shrink: 0;
        }
        .mood-title {
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            font-weight: 600;
            color: #1e3a2a;
            letter-spacing: 0.04em;
        }

        .mood-input-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.4rem 1.4rem 1.6rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(0, 30, 0, 0.05);
        }
        .mood-input-title {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 500;
            color: #1b3a22;
            margin-bottom: 0.8rem;
            opacity: 0.7;
        }
        .mood-input-card input[type="text"] {
            width: 100%;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            border: 1.5px solid rgba(60, 120, 80, 0.15);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: clamp(0.95rem, 2.4vw, 1.1rem);
            color: #1b3a22;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
            margin-bottom: 0.8rem;
        }
        .mood-input-card input[type="text"]::placeholder {
            color: #5a7a6a;
            opacity: 0.5;
            font-weight: 300;
        }
        .mood-input-card input[type="text"]:focus {
            border-color: #4c8b5a;
            box-shadow: 0 0 0 4px rgba(60, 140, 80, 0.1);
            background: rgba(255, 255, 255, 0.8);
        }

        .mood-emoji-selector {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem 0.6rem;
            margin-bottom: 1rem;
        }
        .mood-emoji-label {
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            color: #2d5a3d;
            opacity: 0.7;
            font-weight: 400;
            margin-right: 0.2rem;
        }
        .mood-emoji-options {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .mood-emoji-option {
            font-size: clamp(1.8rem, 4.5vw, 2.6rem);
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s, opacity 0.2s;
            user-select: none;
            line-height: 1;
            padding: 0.1rem 0.15rem;
            border-radius: 12px;
            opacity: 0.5;
            filter: grayscale(0.6);
            transform: scale(0.9);
        }
        .mood-emoji-option:hover {
            transform: scale(1.15);
            opacity: 0.8;
            filter: grayscale(0.2);
        }
        .mood-emoji-option.active {
            opacity: 1;
            filter: grayscale(0);
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 3px rgba(60, 140, 80, 0.15);
            border-radius: 16px;
            padding: 0.1rem 0.3rem;
        }

        .mood-input-card button {
            width: 100%;
            padding: 0.7rem 0;
            border-radius: 60px;
            border: none;
            background: rgba(60, 130, 80, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #fff;
            font-size: clamp(0.95rem, 2.4vw, 1.1rem);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
            box-shadow: 0 4px 12px rgba(40, 100, 60, 0.15);
            font-family: inherit;
            border: 1px solid rgba(255, 255, 255, 0.15);
            letter-spacing: 0.04em;
        }
        .mood-input-card button:hover {
            background: rgba(50, 140, 80, 0.9);
            transform: scale(1.01);
            box-shadow: 0 6px 18px rgba(40, 100, 60, 0.25);
        }
        .mood-input-card button:active {
            transform: scale(0.96);
            transition-duration: 0.08s;
        }

        .mood-today-display {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.2rem 1.4rem 1.4rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(0, 30, 0, 0.05);
            min-height: 80px;
        }
        .mood-today-label {
            font-size: clamp(0.8rem, 1.8vw, 0.95rem);
            font-weight: 500;
            color: #1b3a22;
            opacity: 0.5;
            margin-bottom: 0.4rem;
            letter-spacing: 0.04em;
        }
        .mood-today-content {
            font-size: clamp(1rem, 2.6vw, 1.3rem);
            color: #1b3a22;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            min-height: 2.6rem;
            word-break: break-word;
            line-height: 1.5;
        }
        .mood-today-content .empty-hint {
            color: #5a7a6a;
            opacity: 0.4;
            font-weight: 300;
            font-size: clamp(0.9rem, 2vw, 1.05rem);
        }
        .mood-today-content .today-emoji {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            flex-shrink: 0;
        }
        .mood-today-content .today-text {
            font-weight: 450;
        }

        .mood-history-section {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.2rem 1.4rem 1rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 16px rgba(0, 30, 0, 0.05);
            max-height: 300px;
            overflow-y: auto;
        }
        .mood-history-section::-webkit-scrollbar {
            width: 4px;
        }
        .mood-history-section::-webkit-scrollbar-thumb {
            background: rgba(60, 120, 80, 0.25);
            border-radius: 10px;
        }
        .mood-history-section::-webkit-scrollbar-track {
            background: transparent;
        }
        .mood-history-title {
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 500;
            color: #1b3a22;
            opacity: 0.6;
            margin-bottom: 0.6rem;
            letter-spacing: 0.04em;
        }
        .mood-history-list {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }
        .mood-history-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.3rem;
            border-bottom: 1px solid rgba(60, 120, 80, 0.06);
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: #1b3a22;
        }
        .mood-history-item:last-child {
            border-bottom: none;
        }
        .mood-history-item .h-date {
            font-size: clamp(0.65rem, 1.4vw, 0.8rem);
            color: rgba(30, 60, 40, 0.4);
            flex-shrink: 0;
            min-width: 80px;
        }
        .mood-history-item .h-emoji {
            font-size: clamp(1.2rem, 2.8vw, 1.6rem);
            flex-shrink: 0;
        }
        .mood-history-item .h-text {
            flex: 1;
            font-weight: 400;
            word-break: break-word;
        }
        .mood-history-empty {
            text-align: center;
            color: rgba(30, 60, 40, 0.35);
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            padding: 1.2rem 0;
            font-weight: 300;
        }

        /* ============================================================
                   奶茶记录页 (IndexedDB 升级版)
                   ============================================================ */
        #drinkPage {
            align-items: flex-start;
            padding-top: 1.8rem;
            padding-bottom: 2.8rem;
        }
        .drink-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .drink-top-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0 0.2rem;
        }
        .drink-back {
            flex-shrink: 0;
        }
        .drink-title {
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            font-weight: 600;
            color: #1e3a2a;
            letter-spacing: 0.04em;
        }

        /* 分类标签 */
        .category-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .category-tab {
            flex: 1;
            min-width: 56px;
            padding: 0.5rem 0.6rem;
            border: none;
            border-radius: 30px;
            background: transparent;
            font-size: clamp(0.8rem, 2vw, 1rem);
            font-weight: 500;
            color: #1e3a2a;
            opacity: 0.6;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .category-tab:hover {
            opacity: 0.85;
            background: rgba(255, 255, 255, 0.2);
        }
        .category-tab.active {
            opacity: 1;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 30, 0, 0.06);
        }

        /* 记录列表 — 卡片式 */
        .drink-list {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1rem 1rem 0.6rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            min-height: 120px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 4px 16px rgba(0, 30, 0, 0.05);
        }
        .drink-list::-webkit-scrollbar {
            width: 4px;
        }
        .drink-list::-webkit-scrollbar-thumb {
            background: rgba(60, 120, 80, 0.25);
            border-radius: 10px;
        }
        .drink-list::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 每个记录卡片 */
        .drink-item-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .drink-item-card:last-child {
            margin-bottom: 0;
        }
        .drink-item-card:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        .drink-item-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem 0.6rem;
        }
        .drink-item-brand {
            font-weight: 600;
            color: #1b3a22;
            font-size: clamp(0.95rem, 2.2vw, 1.1rem);
        }
        .drink-item-name {
            font-weight: 500;
            color: #2d5a3d;
            font-size: clamp(0.9rem, 2vw, 1.05rem);
        }
        .drink-item-category-tag {
            display: inline-block;
            padding: 0.05rem 0.7rem;
            border-radius: 30px;
            font-size: clamp(0.6rem, 1.4vw, 0.75rem);
            font-weight: 500;
            background: rgba(60, 140, 80, 0.12);
            color: #2d5a3d;
            border: 1px solid rgba(60, 140, 80, 0.08);
            flex-shrink: 0;
        }
        .drink-item-stars {
            color: #f5b342;
            font-size: clamp(0.75rem, 1.8vw, 0.95rem);
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .drink-item-note {
            font-size: clamp(0.75rem, 1.6vw, 0.88rem);
            color: #3d6a4d;
            opacity: 0.7;
            flex: 1;
            min-width: 60px;
            word-break: break-word;
        }
        .drink-item-note:empty {
            display: none;

    </style>
</head>

                    <div class="mood-emoji-options" id="moodEmojiOptions">

                </div>

    <!-- ================================================================ -->
    <!-- JavaScript -->
    <!-- ================================================================ -->
    <script>
        (function() {
            "use strict";

            // ================================================================
            //  1. 页面切换
            // ================================================================
            const startPage = document.getElementById('startPage');
            const mainPage = document.getElementById('mainPage');
            const drinkPage = document.getElementById('drinkPage');
            const moodPage = document.getElementById('moodPage');
            const helloBtn = document.getElementById('helloBtn');
            const backBtn = document.getElementById('backBtn');
            const drinkBackBtn = document.getElementById('drinkBackBtn');
            const drinkCard = document.getElementById('drinkCard');
            const moodCard = document.getElementById('moodCard');
            const moodBackBtn = document.getElementById('moodBackBtn');

            function showPage(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                const target = document.getElementById(pageId);
                if (target) target.classList.add('active');
                if (pageId === 'drinkPage') {
                    renderDrinkList(currentCategory);
                }
                if (pageId === 'moodPage') {
                    loadAndRenderMood();
                    setTimeout(() => document.getElementById('moodTextInput').focus(), 300);
                }
                if (pageId === 'mainPage') {
                    updateMoodPreviewBadge();
                }
            }

            helloBtn.addEventListener('click', (e) => { e.preventDefault();
                showPage('mainPage');
                updateClockAndGreeting(); });
            backBtn.addEventListener('click', (e) => { e.preventDefault();
                showPage('startPage'); });
            drinkBackBtn.addEventListener('click', (e) => { e.preventDefault();
                showPage('mainPage'); });
            drinkCard.addEventListener('click', () => { showPage('drinkPage'); });
            moodCard.addEventListener('click', () => { showPage('moodPage'); });
            moodBackBtn.addEventListener('click', (e) => { e.preventDefault();
                showPage('mainPage'); });

            // ================================================================
            //  2. 时钟 & 天数
            // ================================================================
            const dateDisplay = document.getElementById('dateDisplay');
            const timeDisplay = document.getElementById('timeDisplay');
            const greetingDisplay = document.getElementById('greetingDisplay');
            const dayNumberEl = document.getElementById('dayNumber');

            function pad(n) { return String(n).padStart(2, '0'); }

            function updateClockAndGreeting() {
                const now = new Date();
                const h = now.getHours(),
                    m = now.getMinutes(),
                    s = now.getSeconds();
                timeDisplay.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
                const year = now.getFullYear(),
                    month = pad(now.getMonth() + 1),
                    day = pad(now.getDate());
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                dateDisplay.textContent = year + '年 ' + month + '月 ' + day + '日  ' + weekdays[now.getDay()];
                let greeting = '',
                    emoji = '';
                if (h >= 6 && h < 12) { greeting = '早安';
                    emoji = '🌅'; } else if (h >= 12 && h < 18) { greeting = '下午好';
                    emoji = '☀️'; } else { greeting = '晚安';
                    emoji = '🌙'; }
                greetingDisplay.textContent = emoji + ' ' + greeting;
                // 天数
                const baseDate = new Date(2026, 7, 3);
                const diffMs = now - baseDate;
                const days = Math.floor(diffMs / (24 * 60 * 60 * 1000)) + 1;
                dayNumberEl.textContent = days < 0 ? 0 : days;
            }
            updateClockAndGreeting();
            setInterval(updateClockAndGreeting, 1000);

            // ================================================================
            //  3. 心情记录 (localStorage)
            // ================================================================
            const MOOD_STORAGE_KEY = 'eyre_mood_records_v2';
            const moodTextInput = document.getElementById('moodTextInput');
            const moodSaveBtn = document.getElementById('moodSaveBtn');
            const moodTodayContent = document.getElementById('moodTodayContent');
            const moodHistoryList = document.getElementById('moodHistoryList');
            const moodEmojiOptions = document.getElementById('moodEmojiOptions');
            const moodPreviewBadge = document.getElementById('moodPreviewBadge');

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate())
                    .padStart(2, '0');
            }

            function formatDateDisplay(dateStr) {
                const p = dateStr.split('-');
                if (p.length !== 3) return dateStr;
                return p[0] + '年' + parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
            }

            function loadAllMoodRecords() {
                try {
                    const data = localStorage.getItem(MOOD_STORAGE_KEY);
                    if (data) { const parsed = JSON.parse(data); if (Array.isArray(parsed)) return parsed; }
                } catch (e) {}
                return [];
            }

            function saveAllMoodRecords(records) {
                localStorage.setItem(MOOD_STORAGE_KEY, JSON.stringify(records));
            }

            function getTodayMood(records) {
                const today = getTodayStr();
                return records.find(r => r.date === today) || null;
            }

            function getHistoryRecords(records) {
                return records.slice().sort((a, b) => b.date.localeCompare(a.date));
            }

            function saveMood(text, emoji) {
                const trimmed = text.trim();
                if (trimmed === '') return false;
                const today = getTodayStr();
                const records = loadAllMoodRecords();
                const idx = records.findIndex(r => r.date === today);
                const newRecord = { date: today, text: trimmed, emoji: emoji || '😐' };
                if (idx >= 0) records[idx] = newRecord;
                else records.push(newRecord);
                saveAllMoodRecords(records);
                return true;
            }

            function loadAndRenderMood() {
                const records = loadAllMoodRecords();
                const today = getTodayStr();
                const todayRecord = records.find(r => r.date === today);
                if (todayRecord) {
                    moodTodayContent.innerHTML =
                        '<span class="today-emoji">' + escapeHtml(todayRecord.emoji || '😐') + '</span>' +
                        '<span class="today-text">' + escapeHtml(todayRecord.text) + '</span>';
                } else {
                    moodTodayContent.innerHTML = '<span class="empty-hint">还没有记录今天的心情 ✍️</span>';
                }
                const history = getHistoryRecords(records);
                if (history.length === 0) {
                    moodHistoryList.innerHTML = '<div class="mood-history-empty">暂无历史记录</div>';
                } else {
                    let html = '';
                    history.forEach(r => {
                        html += `
                            <div class="mood-history-item">
                                <span class="h-date">${escapeHtml(formatDateDisplay(r.date))}</span>
                                <span class="h-emoji">${escapeHtml(r.emoji || '😐')}</span>
                                <span class="h-text">${escapeHtml(r.text)}</span>
                            </div>
                        `;
                    });
                    moodHistoryList.innerHTML = html;
                }
                updateMoodPreviewBadge();
            }

            function updateMoodPreviewBadge() {
                const records = loadAllMoodRecords();
                const today = getTodayStr();
                const todayRecord = records.find(r => r.date === today);
                if (todayRecord) {
                    const emoji = todayRecord.emoji || '🌸';
                    const text = todayRecord.text.length > 12 ? todayRecord.text.slice(0, 12) + '…' : todayRecord.text;
                    moodPreviewBadge.innerHTML =
                        '<span class="preview-emoji">' + escapeHtml(emoji) + '</span>' +
                        '<span class="preview-text">' + escapeHtml(text) + '</span>';
                    moodPreviewBadge.classList.remove('empty-preview');
                } else {
                    moodPreviewBadge.innerHTML =
                        '<span class="preview-emoji">🌸</span><span class="preview-text">记一笔心情</span>';
                    moodPreviewBadge.classList.add('empty-preview');
                }
            }

            // 表情选择
            let selectedMoodEmoji = '😐';
            moodEmojiOptions.addEventListener('click', function(e) {
                const opt = e.target.closest('.mood-emoji-option');
                if (!opt) return;
                const emoji = opt.dataset.emoji;
                if (!emoji) return;
                moodEmojiOptions.querySelectorAll('.mood-emoji-option').forEach(el => el.classList.remove('active'));
                opt.classList.add('active');
                selectedMoodEmoji = emoji;
            });
            // 默认选中
            const defaultMoodOpt = moodEmojiOptions.querySelector('[data-emoji="😐"]');
            if (defaultMoodOpt) { defaultMoodOpt.classList.add('active');
                selectedMoodEmoji = '😐'; }

            moodSaveBtn.addEventListener('click', function() {
                const text = moodTextInput.value.trim();
                if (text === '') { alert('请写下今天的心情 ✍️');
                    moodTextInput.focus(); return; }
                if (saveMood(text, selectedMoodEmoji)) {
                    moodTextInput.value = '';
                    moodEmojiOptions.querySelectorAll('.mood-emoji-option').forEach(el => el.classList.remove(
                    'active'));
                    const def = moodEmojiOptions.querySelector('[data-emoji="😐"]');
                    if (def) { def.classList.add('active');
                        selectedMoodEmoji = '😐'; } else { selectedMoodEmoji = '😐'; }
                    loadAndRenderMood();
                    moodTodayContent.style.transition = 'opacity 0.2s';
                    moodTodayContent.style.opacity = '0.6';
                    setTimeout(() => { moodTodayContent.style.opacity = '1'; }, 150);
                    moodTextInput.focus();
                } else {
                    alert('保存失败，请重试');
                }
            });
            moodTextInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    moodSaveBtn.click(); } });

            // 迁移旧心情数据
            (function migrateOldMood() {
                const oldKey = 'eyre_workbench_mood';
                try {
                    const old = localStorage.getItem(oldKey);
                    if (old && old.trim() !== '') {
                        const records = loadAllMoodRecords();
                        if (records.length === 0) {
                            const today = getTodayStr();
                            saveAllMoodRecords([{ date: today, text: old.trim(), emoji: '🌸' }]);
                            localStorage.removeItem(oldKey);
                            console.log('✅ 已迁移旧心情数据');
                        }
                    }
                } catch (e) {}
            })();

            // ================================================================
            //  4. 奶茶记录 — IndexedDB
            // ================================================================

            // ---------- 数据库配置 ----------
            const DB_NAME = 'EyreWorkbenchDB';
            const DB_VERSION = 1;
            const STORE_NAME = 'drinkRecords';

            // ---------- 打开数据库 ----------
            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            // 创建对象存储，使用 id 作为主键（自增）
                            const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                            // 为分类创建索引，便于按分类查询
                            store.createIndex('category', 'category', { unique: false });
                            store.createIndex('date', 'date', { unique: false });
                        }
                    };
                    request.onsuccess = (event) => resolve(event.target.result);
                    request.onerror = (event) => reject(event.target.error);
                });
            }

            // ---------- 工具：生成新 ID (兼容旧数据) ----------
            function generateId() {
                return Date.now() + Math.floor(Math.random() * 1000);
            }

            // ---------- 增 ----------
            async function addDrinkRecord(record) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    // 确保有 id
                    if (!record.id) record.id = generateId();
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.add(record);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                    tx.oncomplete = () => { db.close(); };
                });
            }

            // ---------- 查（全部） ----------
            async function getAllDrinkRecords() {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                    tx.oncomplete = () => { db.close(); };
                });
            }

            // ---------- 按分类查 ----------
            async function getDrinkRecordsByCategory(category) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const index = store.index('category');
                    const request = index.getAll(category);
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                    tx.oncomplete = () => { db.close(); };
                });
            }

            // ---------- 删 ----------
            async function deleteDrinkRecord(id) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                    tx.oncomplete = () => { db.close(); };
                });
            }

            // ---------- 迁移：从 localStorage 导入旧数据 ----------
            async function migrateDrinkDataFromLocalStorage() {
                const OLD_KEY = 'eyre_drink_records';
                try {
                    const oldData = localStorage.getItem(OLD_KEY);
                    if (!oldData) return false;
                    const parsed = JSON.parse(oldData);
                    if (!parsed || !Array.isArray(parsed.records) || parsed.records.length === 0) return false;

                    // 检查是否已迁移（新库中有数据）
                    const existing = await getAllDrinkRecords();
                    if (existing.length > 0) {
                        // 已有数据，不覆盖，但可以删除旧 localStorage 标记
                        localStorage.removeItem(OLD_KEY);
                        return false;
                    }

                    // 分类映射：酒类 → 其他
                    const categoryMap = { '酒类': '其他' };

                    // 转换并写入
                    let migratedCount = 0;
                    for (const old of parsed.records) {
                        const newRecord = {
                            id: old.id || generateId(),
                            brand: '未知', // 旧数据没有品牌
                            name: old.name || '未命名',
                            category: categoryMap[old.category] || old.category || '其他',
                            rating: old.rating || 3,
                            note: '', // 旧数据没有备注
                            date: old.date || getTodayStr()
                        };
                        try {
                            await addDrinkRecord(newRecord);
                            migratedCount++;
                        } catch (e) {
                            console.warn('迁移单条记录失败:', e);
                        }
                    }

                    if (migratedCount > 0) {
                        localStorage.removeItem(OLD_KEY);
                        console.log('✅ 已从 localStorage 迁移 ' + migratedCount + ' 条奶茶记录到 IndexedDB');
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.warn('迁移奶茶数据失败:', e);
                    return false;
                }
            }

            // ---------- 渲染列表 ----------
            let currentCategory = '奶茶';

            const drinkList = document.getElementById('drinkList');
            const categoryTabs = document.getElementById('categoryTabs');

            // 分类切换
            categoryTabs.addEventListener('click', function(e) {
                const tab = e.target.closest('.category-tab');
                if (!tab) return;
                categoryTabs.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                renderDrinkList(currentCategory);
            });

            // 渲染
            async function renderDrinkList(category) {
                try {
                    const records = await getDrinkRecordsByCategory(category);
                    // 按日期降序，同日期按 id 降序
                    records.sort((a, b) => {
                        if (a.date !== b.date) return b.date.localeCompare(a.date);
                        return (b.id || 0) - (a.id || 0);
                    });

                    if (records.length === 0) {
                        drinkList.innerHTML = `<div class="drink-empty">🍃 还没有记录，写点什么吧</div>`;
                        return;
                    }

                    let html = '';
                    for (const r of records) {
                        const stars = '⭐'.repeat(Math.min(r.rating || 0, 5)) +
                            '☆'.repeat(Math.max(0, 5 - (r.rating || 0)));
                        const brand = escapeHtml(r.brand || '');
                        const name = escapeHtml(r.name || '未命名');
                        const categoryLabel = escapeHtml(r.category || '其他');
                        const note = escapeHtml(r.note || '');
                        const date = escapeHtml(r.date || '');
                        const id = r.id;

                        html += `
                            <div class="drink-item-card" data-id="${id}">
                                <div class="drink-item-row">
                                    <span class="drink-item-brand">${brand}</span>
                                    <span class="drink-item-name">${name}</span>
                                    <span class="drink-item-category-tag">${categoryLabel}</span>
                                </div>
                                <div class="drink-item-row">
                                    <span class="drink-item-stars">${stars}</span>
                                    ${note ? `<span class="drink-item-note">📝 ${note}</span>` : ''}
                                    <span class="drink-item-date">📅 ${date}</span>
                                    <button class="drink-item-delete" data-id="${id}">🗑 删除</button>
                                </div>
                            </div>
                        `;
                    }
                    drinkList.innerHTML = html;

                    // 绑定删除事件
                    drinkList.querySelectorAll('.drink-item-delete').forEach(btn => {
                        btn.addEventListener('click', async function(e) {
                            e.stopPropagation();
                            const id = Number(this.dataset.id);
                            if (!id) return;
                            if (!confirm('确定要删除这条记录吗？')) return;
                            try {
                                await deleteDrinkRecord(id);
                                await renderDrinkList(currentCategory);
                            } catch (err) {
                                alert('删除失败：' + err.message);
                            }
                        });
                    });

                } catch (err) {
                    console.error('渲染列表失败:', err);
                    drinkList.innerHTML = `<div class="drink-empty">⚠️ 加载失败，请刷新重试</div>`;
                }
            }

            // ---------- 表单 ----------
            const drinkBrandInput = document.getElementById('drinkBrandInput');
            const drinkNameInput = document.getElementById('drinkNameInput');
            const drinkCategorySelect = document.getElementById('drinkCategorySelect');
            const drinkDateInput = document.getElementById('drinkDateInput');
            const drinkNoteInput = document.getElementById('drinkNoteInput');
            const drinkStarRating = document.getElementById('drinkStarRating');
            const drinkSaveBtn = document.getElementById('drinkSaveBtn');
            const drinkClearFormBtn = document.getElementById('drinkClearFormBtn');

            // 星级选择
            let selectedDrinkRating = 0;
            drinkStarRating.addEventListener('click', function(e) {
                const star = e.target.closest('.star');
                if (!star) return;
                const value = parseInt(star.dataset.value, 10);
                selectedDrinkRating = value;
                drinkStarRating.querySelectorAll('.star').forEach(s => {
                    const v = parseInt(s.dataset.value, 10);
                    s.classList.toggle('active', v <= value);
                });
            });

            // 设置日期默认今天
            function setDefaultDate() {
                const today = getTodayStr();
                drinkDateInput.value = today;
            }
            setDefaultDate();

            // 清空表单
            function clearDrinkForm() {
                drinkBrandInput.value = '';
                drinkNameInput.value = '';
                drinkCategorySelect.value = '奶茶';
                drinkNoteInput.value = '';
                setDefaultDate();
                selectedDrinkRating = 0;
                drinkStarRating.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
                drinkBrandInput.focus();
            }
            drinkClearFormBtn.addEventListener('click', clearDrinkForm);

            // 保存
            drinkSaveBtn.addEventListener('click', async function() {
                const brand = drinkBrandInput.value.trim();
                const name = drinkNameInput.value.trim();
                const category = drinkCategorySelect.value;
                const note = drinkNoteInput.value.trim();
                const date = drinkDateInput.value;

                if (!brand) { alert('请输入品牌 ✍️');
                    drinkBrandInput.focus(); return; }
                if (!name) { alert('请输入名称 ✍️');
                    drinkNameInput.focus(); return; }
                if (selectedDrinkRating === 0) { alert('请选择喜好程度 ⭐');
                    return; }
                if (!date) { alert('请选择日期 📅'); return; }

                const record = {
                    id: generateId(),
                    brand: brand,
                    name: name,
                    category: category,
                    rating: selectedDrinkRating,
                    note: note,
                    date: date
                };

                try {
                    await addDrinkRecord(record);
                    await renderDrinkList(currentCategory);
                    clearDrinkForm();
                    // 轻提示
                    drinkSaveBtn.textContent = '✅ 已保存';
                    setTimeout(() => { drinkSaveBtn.textContent = '保存'; }, 1200);
                } catch (err) {
                    alert('保存失败：' + err.message);
                }
            });

            // 回车快捷保存
            drinkNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    drinkSaveBtn.click(); } });
            drinkBrandInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    drinkNameInput.focus(); } });

            // ---------- 初始化奶茶模块 ----------
            async function initDrinkModule() {
                try {
                    // 1. 迁移旧数据
                    await migrateDrinkDataFromLocalStorage();
                    // 2. 渲染当前分类
                    await renderDrinkList(currentCategory);
                    console.log('🧋 奶茶记录已初始化 (IndexedDB)');
                } catch (err) {
                    console.error('奶茶模块初始化失败:', err);
                    drinkList.innerHTML = `<div class="drink-empty">⚠️ 数据加载失败，请刷新重试</div>`;
                }
            }

            // ================================================================
            //  5. 启动
            // ================================================================

            // 初始化心情
            loadAndRenderMood();

            // 初始化奶茶 (IndexedDB)
            initDrinkModule();

            // 页面可见性变化时刷新
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateClockAndGreeting();
                    if (moodPage.classList.contains('active')) loadAndRenderMood();
                    if (drinkPage.classList.contains('active')) renderDrinkList(currentCategory);
                    updateMoodPreviewBadge();
                }
            });

            // 确保启动页可见
            document.addEventListener('DOMContentLoaded', function() {
                if (!startPage.classList.contains('active') &&
                    !mainPage.classList.contains('active') &&
                    !drinkPage.classList.contains('active') &&
                    !moodPage.classList.contains('active')) {
                    startPage.classList.add('active');
                }
                // 分类高亮
                const firstTab = categoryTabs.querySelector('.category-tab');
                if (firstTab) {
                    categoryTabs.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    firstTab.classList.add('active');
                    currentCategory = firstTab.dataset.category;
                }
                if (drinkPage.classList.contains('active')) renderDrinkList(currentCategory);
                if (moodPage.classList.contains('active')) loadAndRenderMood();
                updateMoodPreviewBadge();
            });

            console.log('✨ Eyre 工作台已加载 (奶茶记录 → IndexedDB) ✨');

        })();
    </script>
</body>
</html>
