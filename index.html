                    const allRecords = await getAllDrinkRecords();
                    const now = new Date();
                    const currentMonth = now.getMonth();
                    const currentYear = now.getFullYear();

                    // 筛选本月记录
                    const monthRecords = allRecords.filter(r => {
                        const d = new Date(r.date);
                        return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
                    });

                    if (monthRecords.length === 0) {
                        descEl.textContent = '本月还没喝过，去记录一杯吧 🧋';
                        return;
                    }

                    // 找出评分最高的记录（若平局，取第一个）
                    const best = monthRecords.reduce((a, b) => (a.rating > b.rating ? a : b));
                    const favorite = `${best.brand || ''} ${best.name || ''}`.trim() || '未知';
                    descEl.textContent = `本月喝了 ${monthRecords.length} 杯，最爱：${favorite}`;
                } catch (e) {
                    console.warn('更新奶茶卡片统计失败:', e);
                    descEl.textContent = '加载数据失败';
                }
            }

            /**
             * 更新心情卡片统计信息
             * 统计本周（周一至周日）的心情 emoji 出现频率，取最高频的
             */
            function updateMoodCardStats() {
                const descEl = document.getElementById('moodStatsDesc');
                if (!descEl) return;
                const records = loadAllMoodRecords();

                // 计算本周一和本周日
                const now = new Date();
                const dayOfWeek = now.getDay(); // 0=周日
                const diffToMonday = (dayOfWeek === 0 ? 6 : dayOfWeek - 1);
                const monday = new Date(now);
                monday.setDate(now.getDate() - diffToMonday);
                monday.setHours(0, 0, 0, 0);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                sunday.setHours(23, 59, 59, 999);

                const weekRecords = records.filter(r => {
                    const d = new Date(r.date);
                    return d >= monday && d <= sunday;
                });

                if (weekRecords.length === 0) {
                    descEl.textContent = '本周还没记录心情';
                    return;
                }

                // 统计各 emoji 出现次数
                const freq = {};
                weekRecords.forEach(r => {
                    const emoji = r.emoji || '😐';
                    freq[emoji] = (freq[emoji] || 0) + 1;
                });
                let maxEmoji = '😐';
                let maxCount = 0;
                for (const [emoji, count] of Object.entries(freq)) {
                    if (count > maxCount) {
                        maxCount = count;
                        maxEmoji = emoji;
                    }
                }
                descEl.textContent = `本周平均心情：${maxEmoji}`;
            }

            // ================================================================
            //  ★ 搜索框防抖与跳转逻辑
            // ================================================================

            let searchDebounceTimer = null;

            globalSearchInput.addEventListener('input', function() {
                const val = this.value.trim();
                if (searchDebounceTimer) {
                    clearTimeout(searchDebounceTimer);
                    searchDebounceTimer = null;
                }
                if (val === '') {
                    window._searchKeyword = '';
                    if (drinkPage.classList.contains('active')) {
                        clearSearchState();
                        renderDrinkList(currentCategory);
                    }
                    return;
                }
                searchDebounceTimer = setTimeout(() => {
                    const keyword = globalSearchInput.value.trim();
                    if (keyword === '') return;
                    window._searchKeyword = keyword;
                    showPage('drinkPage');
                    renderDrinkListWithSearch(keyword);
                    searchDebounceTimer = null;
                }, 300);
            });

            globalSearchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = this.value.trim();
                    if (val === '') return;
                    if (searchDebounceTimer) {
                        clearTimeout(searchDebounceTimer);
                        searchDebounceTimer = null;
                    }
                    window._searchKeyword = val;
                    showPage('drinkPage');
                    renderDrinkListWithSearch(val);
                }
            });

            // ================================================================
            //  5. 表单（奶茶）
            // ================================================================

            const drinkBrandInput = document.getElementById('drinkBrandInput');
            const drinkNameInput = document.getElementById('drinkNameInput');
            const drinkCategorySelect = document.getElementById('drinkCategorySelect');
            const drinkDateInput = document.getElementById('drinkDateInput');
            const drinkNoteInput = document.getElementById('drinkNoteInput');
            const drinkStarRating = document.getElementById('drinkStarRating');
            const drinkSaveBtn = document.getElementById('drinkSaveBtn');
            const drinkClearFormBtn = document.getElementById('drinkClearFormBtn');

            let selectedDrinkRating = 0;
            drinkStarRating.addEventListener('click', function(e) {
                const star = e.target.closest('.star');
                if (!star) return;
                const value = parseInt(star.dataset.value, 10);
                selectedDrinkRating = value;
                drinkStarRating.querySelectorAll('.star').forEach(s => {
                    const v = parseInt(s.dataset.value, 10);
                    s.classList.toggle('active', v <= value);
                });
            });

            function setDefaultDate() {
                const today = getTodayStr();
                drinkDateInput.value = today;
            }
            setDefaultDate();

            function clearDrinkForm() {
                drinkBrandInput.value = '';
                drinkNameInput.value = '';
                drinkCategorySelect.value = '奶茶';
                drinkNoteInput.value = '';
                setDefaultDate();
                selectedDrinkRating = 0;
                drinkStarRating.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
                drinkBrandInput.focus();
            }
            drinkClearFormBtn.addEventListener('click', clearDrinkForm);

            drinkSaveBtn.addEventListener('click', async function() {
                const brand = drinkBrandInput.value.trim();
                const name = drinkNameInput.value.trim();
                const category = drinkCategorySelect.value;
                const note = drinkNoteInput.value.trim();
                const date = drinkDateInput.value;
                if (!brand) { alert('请输入品牌 ✍️');
                    drinkBrandInput.focus(); return; }
                if (!name) { alert('请输入名称 ✍️');
                    drinkNameInput.focus(); return; }
                if (selectedDrinkRating === 0) { alert('请选择喜好程度 ⭐'); return; }
                if (!date) { alert('请选择日期 📅'); return; }
                const record = {
                    id: generateId(),
                    brand: brand,
                    name: name,
                    category: category,
                    rating: selectedDrinkRating,
                    note: note,
                    date: date
                };
                try {
                    await addDrinkRecord(record);
                    if (window._searchKeyword && window._searchKeyword.trim() !== '') {
                        await renderDrinkListWithSearch(window._searchKeyword.trim());
                    } else {
                        await renderDrinkList(currentCategory);
                    }
                    clearDrinkForm();
                    drinkSaveBtn.textContent = '✅ 已保存';
                    setTimeout(() => { drinkSaveBtn.textContent = '保存'; }, 1200);
                    // 更新主页卡片
                    if (mainPage.classList.contains('active')) {
                        updateDrinkCardStats();
                    }
                } catch (err) {
                    alert('保存失败：' + err.message);
                }
            });

            drinkNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    drinkSaveBtn.click(); } });
            drinkBrandInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    drinkNameInput.focus(); } });

            // ================================================================
            //  6. 初始化
            // ================================================================

            async function initDrinkModule() {
                try {
                    await migrateDrinkDataFromLocalStorage();
                    await renderDrinkList(currentCategory);
                    // 更新主页卡片（如果主页可见）
                    if (mainPage.classList.contains('active')) {
                        updateDrinkCardStats();
                    }
                    console.log('🧋 奶茶记录已初始化 (IndexedDB + Fuse.js)');
                } catch (err) {
                    console.error('奶茶模块初始化失败:', err);
                    drinkList.innerHTML = `<div class="drink-empty">⚠️ 数据加载失败，请刷新重试</div>`;
                }
            }

            // 加载心情并更新卡片
            loadAndRenderMood();
            // 初始化奶茶模块
            initDrinkModule();

            // 监听可见性变化刷新数据
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateClockAndGreeting();
                    if (moodPage.classList.contains('active')) loadAndRenderMood();
                    if (drinkPage.classList.contains('active')) {
                        if (window._searchKeyword && window._searchKeyword.trim() !== '') {
                            renderDrinkListWithSearch(window._searchKeyword.trim());
                        } else {
                            renderDrinkList(currentCategory);
                        }
                    }
                    if (mainPage.classList.contains('active')) {
                        updateDrinkCardStats();
                        updateMoodCardStats();
                        updateMoodPreviewBadge();
                    }
                }
            });

            // DOM 就绪后初始化
            document.addEventListener('DOMContentLoaded', function() {
                if (!startPage.classList.contains('active') &&
                    !mainPage.classList.contains('active') &&
                    !drinkPage.classList.contains('active') &&
                    !moodPage.classList.contains('active')) {
                    startPage.classList.add('active');
                }
                const firstTab = categoryTabs.querySelector('.category-tab');
                if (firstTab) {
                    categoryTabs.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    firstTab.classList.add('active');
                    currentCategory = firstTab.dataset.category;
                }
                if (drinkPage.classList.contains('active')) {
                    if (window._searchKeyword && window._searchKeyword.trim() !== '') {
                        renderDrinkListWithSearch(window._searchKeyword.trim());
                    } else {
                        renderDrinkList(currentCategory);
                    }
                }
                if (moodPage.classList.contains('active')) loadAndRenderMood();
                if (mainPage.classList.contains('active')) {
                    updateDrinkCardStats();
                    updateMoodCardStats();
                    updateMoodPreviewBadge();
                }
            });

            console.log('✨ Eyre 工作台已加载 (数据卡片升级完成) ✨');

        })();
    </script>
</body>
</html>
