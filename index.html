<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Eyre 工作台</title>
    <style>
        /* ———— 全局重置 & 基础 ———— */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #e3f2e3 0%, #b8d9b8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ———— 页面容器（启动页 & 主页） ———— */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.8rem 1.2rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.55s ease, visibility 0.55s ease;
            will-change: opacity, visibility;
            z-index: 1;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        /* ———— 启动页 ———— */
        #startPage .start-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 520px;
            padding: 1.2rem;
        }

        .hello-btn {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            padding: 1.2rem 3.2rem;
            border-radius: 80px;
            font-size: clamp(2.6rem, 10vw, 4.8rem);
            font-weight: 600;
            color: #1e3a2a;
            letter-spacing: 0.04em;
            box-shadow: 0 20px 40px -12px rgba(30, 60, 40, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.3s ease;
            user-select: none;
            line-height: 1.3;
            min-width: 200px;
        }

        .hello-btn:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 28px 48px -14px rgba(30, 60, 40, 0.35);
            background: rgba(255, 255, 255, 0.65);
        }

        .hello-btn:active {
            transform: scale(0.96);
            transition-duration: 0.08s;
        }

        .start-slogan {
            margin-top: 2.2rem;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #1f4a2d;
            font-weight: 400;
            letter-spacing: 0.06em;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: floatSlogan 4s ease-in-out infinite;
            line-height: 1.5;
        }

        @keyframes floatSlogan {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* ———— 工作台主页 ———— */
        #mainPage {
            align-items: flex-start;
            padding-top: 2.2rem;
            padding-bottom: 2.8rem;
        }

        .main-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
        }

        /* --- 顶部栏：返回 + 日期时间 --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.6rem 1rem;
            padding: 0.2rem 0.2rem 0.4rem 0.2rem;
        }

        .back-link {
            font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            color: #1f4a2d;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 0.5rem 1.2rem 0.5rem 0.9rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            font-weight: 500;
            transition: background 0.25s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            box-shadow: 0 2px 8px rgba(0, 30, 0, 0.06);
            white-space: nowrap;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.55);
            transform: translateX(-2px);
        }

        .back-link:active {
            transform: scale(0.94);
        }

        .datetime-group {
            text-align: right;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0.6rem 1.4rem 0.7rem 1.4rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 12px rgba(0, 30, 0, 0.06);
            min-width: 140px;
        }

        .date-display {
            font-size: clamp(0.85rem, 2.2vw, 1.1rem);
            color: #1e3a2a;
            font-weight: 500;
            letter-spacing: 0.04em;
            opacity: 0.85;
            line-height: 1.4;
        }

        .time-display {
            font-size: clamp(2rem, 6.5vw, 3.2rem);
            font-weight: 600;
            color: #163623;
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            margin-top: 0.1rem;
        }

        .greeting-display {
            font-size: clamp(1rem, 2.8vw, 1.45rem);
            font-weight: 500;
            color: #1f4a2d;
            letter-spacing: 0.04em;
            opacity: 0.9;
            margin-top: 0.1rem;
        }

        /* --- 三个卡片 --- */
        .cards-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.2rem;
            margin-top: 0.2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.6rem 1rem 1.8rem 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(0, 30, 0, 0.08);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            cursor: default;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(0, 30, 0, 0.12);
            background: rgba(255, 255, 255, 0.7);
        }

        .card-emoji {
            font-size: clamp(2.6rem, 6vw, 3.6rem);
            line-height: 1.2;
            margin-bottom: 0.3rem;
        }

        .card-title {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 600;
            color: #1b3a22;
            letter-spacing: 0.03em;
        }

        .card-desc {
            font-size: clamp(0.7rem, 1.8vw, 0.9rem);
            color: #2d5a3d;
            opacity: 0.7;
            margin-top: 0.2rem;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* --- 今日心情区域 --- */
        .mood-section {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.6rem 1.6rem 1.8rem 1.6rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 24px rgba(0, 30, 0, 0.07);
            margin-top: 0.2rem;
            transition: box-shadow 0.3s;
        }

        .mood-section:hover {
            box-shadow: 0 12px 32px rgba(0, 30, 0, 0.10);
        }

        .mood-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .mood-header h3 {
            font-size: clamp(1.1rem, 2.8vw, 1.5rem);
            font-weight: 600;
            color: #1b3a22;
            letter-spacing: 0.04em;
        }

        .mood-header span {
            font-size: 1.2rem;
        }

        .mood-input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
        }

        .mood-input-row input {
            flex: 1 1 180px;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            border: 1.5px solid rgba(60, 120, 80, 0.2);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: clamp(0.95rem, 2.4vw, 1.1rem);
            color: #1b3a22;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
            font-family: inherit;
            min-height: 48px;
        }

        .mood-input-row input::placeholder {
            color: #5a7a6a;
            opacity: 0.6;
            font-weight: 300;
        }

        .mood-input-row input:focus {
            border-color: #4c8b5a;
            box-shadow: 0 0 0 4px rgba(60, 140, 80, 0.15);
            background: rgba(255, 255, 255, 0.8);
        }

        .mood-input-row button {
            padding: 0.7rem 1.8rem;
            border-radius: 60px;
            border: none;
            background: rgba(60, 130, 80, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #fff;
            font-size: clamp(0.95rem, 2.4vw, 1.1rem);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
            box-shadow: 0 4px 12px rgba(40, 100, 60, 0.2);
            font-family: inherit;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
        }

        .mood-input-row button:hover {
            background: rgba(50, 140, 80, 0.9);
            transform: scale(1.02);
            box-shadow: 0 6px 18px rgba(40, 100, 60, 0.3);
        }

        .mood-input-row button:active {
            transform: scale(0.94);
            transition-duration: 0.08s;
        }

        .mood-display {
            margin-top: 1.2rem;
            padding: 0.8rem 1.4rem;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: clamp(1rem, 2.6vw, 1.3rem);
            color: #1b3a22;
            min-height: 3.4rem;
            border: 1px dashed rgba(60, 120, 80, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            word-break: break-word;
            line-height: 1.5;
        }

        .mood-display.has-mood {
            border: 1px solid rgba(60, 140, 80, 0.3);
            background: rgba(255, 255, 255, 0.55);
        }

        .mood-display .mood-emoji {
            margin-right: 0.5rem;
            flex-shrink: 0;
        }

        .mood-display .mood-text {
            font-weight: 450;
        }

        .mood-display .empty-hint {
            color: #5a7a6a;
            opacity: 0.5;
            font-weight: 300;
        }

        /* ———— 响应式微调 ———— */
        @media (max-width: 500px) {
            .page {
                padding: 1rem 0.8rem;
            }
            #mainPage {
                padding-top: 1.2rem;
                padding-bottom: 1.8rem;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.8rem;
            }
            .back-link {
                align-self: flex-start;
            }
            .datetime-group {
                text-align: center;
                width: 100%;
                padding: 0.6rem 0.8rem;
            }
            .cards-row {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
            .card {
                min-height: 120px;
                padding: 1.2rem 0.6rem;
            }
            .mood-section {
                padding: 1.2rem 1rem 1.4rem 1rem;
            }
            .mood-input-row input {
                flex: 1 1 100%;
                min-height: 44px;
            }
            .mood-input-row button {
                flex: 1 1 100%;
                min-height: 44px;
            }
            .mood-display {
                min-height: 2.8rem;
                padding: 0.6rem 1rem;
            }
        }

        @media (max-width: 380px) {
            .cards-row {
                grid-template-columns: 1fr;
                gap: 0.7rem;
            }
            .card {
                min-height: 100px;
                flex-direction: row;
                gap: 0.8rem;
                padding: 0.8rem 1rem;
                justify-content: flex-start;
                text-align: left;
            }
            .card-emoji {
                font-size: 2.2rem;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            .card-title {
                font-size: 1rem;
            }
            .card-desc {
                font-size: 0.75rem;
            }
            .card-text-group {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* ———— 工具类 ———— */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- ===== 启动页 ===== -->
    <div id="startPage" class="page active">
        <div class="start-content">
            <button class="hello-btn" id="helloBtn">Hello Eyre</button>
            <div class="start-slogan">✨ 公主今天也要认真经营人生主线游戏！</div>
        </div>
    </div>

    <!-- ===== 工作台主页 ===== -->
    <div id="mainPage" class="page">
        <div class="main-container">

            <!-- 顶部：返回 + 日期时间 -->
            <div class="top-bar">
                <a class="back-link" id="backBtn">← 返回启动页</a>
                <div class="datetime-group">
                    <div class="date-display" id="dateDisplay">----年--月--日</div>
                    <div class="time-display" id="timeDisplay">00:00:00</div>
                    <div class="greeting-display" id="greetingDisplay">☀️ 下午好</div>
                    <!-- 在 greeting-display 后面添加 -->
                    <div class="day-divider"></div>
                    <div class="day-count">
                        <span class="day-icon">📅</span>
                        这是你使用工作台的第 <span class="day-number" id="dayNumber">1</span> 天
                    </div>
                </div>
            </div>

            <!-- 三个卡片 -->
            <div class="cards-row">
                <div class="card">
                    <div class="card-emoji">📔</div>
                    <div class="card-text-group">
                        <div class="card-title">日记</div>
                        <div class="card-desc">记录今日所思所想</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-emoji">📚</div>
                    <div class="card-text-group">
                        <div class="card-title">读书</div>
                        <div class="card-desc">沉浸文字的世界</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-emoji">📊</div>
                    <div class="card-text-group">
                        <div class="card-title">商情简报</div>
                        <div class="card-desc">洞察市场动向</div>
                    </div>
                </div>
            </div>

            <!-- 今日心情 -->
            <div class="mood-section">
                <div class="mood-header">
                    <span>💭</span>
                    <h3>今日心情</h3>
                </div>
                <div class="mood-input-row">
                    <input type="text" id="moodInput" placeholder="今天感觉怎么样？" maxlength="200" autocomplete="off" />
                    <button id="moodSaveBtn">保存</button>
                </div>
                <div class="mood-display" id="moodDisplay">
                    <span class="empty-hint">还没有记录，写点什么吧 ✍️</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ———— DOM 引用 ————
            const startPage = document.getElementById('startPage');
            const mainPage = document.getElementById('mainPage');
            const helloBtn = document.getElementById('helloBtn');
            const backBtn = document.getElementById('backBtn');

            const dateDisplay = document.getElementById('dateDisplay');
            const timeDisplay = document.getElementById('timeDisplay');
            const greetingDisplay = document.getElementById('greetingDisplay');

            const moodInput = document.getElementById('moodInput');
            const moodSaveBtn = document.getElementById('moodSaveBtn');
            const moodDisplay = document.getElementById('moodDisplay');

            // ———— 页面切换 ————
            function showPage(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
            }

            helloBtn.addEventListener('click', function(e) {
                e.preventDefault();
                showPage('mainPage');
                // 进入主页后立即刷新时间 & 心情
                updateClockAndGreeting();
                loadMood();
                // 输入框自动获得焦点（移动端友好）
                setTimeout(() => moodInput.focus(), 300);
            });

            backBtn.addEventListener('click', function(e) {
                e.preventDefault();
                showPage('startPage');
            });

            // ———— 时钟 & 问候语 ————
            function pad(n) {
                return String(n).padStart(2, '0');
            }

            function updateClockAndGreeting() {
                const now = new Date();
                const h = now.getHours();
                const m = now.getMinutes();
                const s = now.getSeconds();

                // 时间
                timeDisplay.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);

                // 日期 + 星期
                const year = now.getFullYear();
                const month = pad(now.getMonth() + 1);
                const day = pad(now.getDate());
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const weekday = weekdays[now.getDay()];
                dateDisplay.textContent = year + '年 ' + month + '月 ' + day + '日  ' + weekday;

                // 问候语
                let greeting = '';
                let emoji = '';
                if (h >= 6 && h < 12) {
                    greeting = '早安';
                    emoji = '🌅';
                } else if (h >= 12 && h < 18) {
                    greeting = '下午好';
                    emoji = '☀️';
                } else {
                    greeting = '晚安';
                    emoji = '🌙';
                }
                greetingDisplay.textContent = emoji + ' ' + greeting;
            }

            // 立即执行一次，然后每秒更新
            updateClockAndGreeting();
            setInterval(updateClockAndGreeting, 1000);

            // ———— 今日心情 (localStorage) ————
            const MOOD_KEY = 'eyre_workbench_mood';

            function loadMood() {
                const saved = localStorage.getItem(MOOD_KEY);
                if (saved && saved.trim() !== '') {
                    const displayText = saved.trim();
                    moodDisplay.innerHTML =
                        '<span class="mood-emoji">🌸</span><span class="mood-text">' +
                        escapeHtml(displayText) +
                        '</span>';
                    moodDisplay.classList.add('has-mood');
                } else {
                    moodDisplay.innerHTML = '<span class="empty-hint">还没有记录，写点什么吧 ✍️</span>';
                    moodDisplay.classList.remove('has-mood');
                }
            }

            // 简单的防 XSS (转义)
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function saveMood(text) {
                const trimmed = text.trim();
                if (trimmed === '') {
                    // 如果输入为空，视为清除心情
                    localStorage.removeItem(MOOD_KEY);
                    loadMood();
                    return;
                }
                localStorage.setItem(MOOD_KEY, trimmed);
                loadMood();
            }

            moodSaveBtn.addEventListener('click', function() {
                const val = moodInput.value;
                saveMood(val);
                moodInput.value = ''; // 清空输入框
                // 保存后让输入框继续保持焦点
                setTimeout(() => moodInput.focus(), 100);
            });

            // 回车保存
            moodInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    moodSaveBtn.click();
                }
            });

            // 页面加载时加载心情 (如果主页是初始显示，但默认启动页可见，所以主页加载时调用)
            // 但为了保险，在切换到主页时也会调用 loadMood
            // 同时，如果用户直接刷新页面时停留在主页（但我们的设计默认启动页），
            // 但以防万一，在页面加载时也加载一次
            loadMood();

            // 额外：在显示主页时重新加载心情（但showPage里已经调用了）
            // 但为了确保，在点击helloBtn时调用了loadMood

            // 如果用户直接访问页面且主页处于激活状态（极少情况，因为默认启动页active），
            // 但为了健壮，在DOM加载完成后检查一下
            document.addEventListener('DOMContentLoaded', function() {
                // 如果主页是激活状态（比如通过某些方式直接显示），加载心情
                if (mainPage.classList.contains('active')) {
                    loadMood();
                }
                // 确保启动页是可见的（默认应该是）
                // 但如果有意外，保证启动页可见
                if (!startPage.classList.contains('active') && !mainPage.classList.contains('active')) {
                    startPage.classList.add('active');
                }
            });

            // 也监听页面可见性变化，切回页面时刷新时间（但setInterval已经做了）
            // 额外：在页面可见时刷新一次时间
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateClockAndGreeting();
                }
            });

            // ———— 启动页进入动画优化：预加载 ————
            // 进入主页时，确保时间显示正确

            console.log('✨ Eyre 工作台已加载 ✨');
        })();
    </script>
</body>
</html>
